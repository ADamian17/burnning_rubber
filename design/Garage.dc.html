<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Underdog&family=Outfit:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root{
      --ink:#0A0806; --orange:#F28D35; --hot:#f77503; --lite:#FFB765;
      --cream:#F5EFE4; --muted:#9C9184; --gold:#FFC93C; --cyan:#35D6F2; --red:#E4322B;
      --display:'Underdog','Chalkboard SE','Comic Sans MS',cursive;
      --ui:'Outfit','Avenir Next','Segoe UI',system-ui,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--ui);background:#000;color:var(--cream);-webkit-font-smoothing:antialiased;}
    a{color:var(--orange);} a:hover{color:var(--hot);}
    .screen{position:relative;width:393px;height:852px;overflow:hidden;background:var(--ink);}
    .scan{position:absolute;inset:0;z-index:90;pointer-events:none;
      background:repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1px,rgba(0,0,0,0) 1px 3px);}
    .vig{position:absolute;inset:0;z-index:91;pointer-events:none;
      background:radial-gradient(125% 78% at 50% 44%,rgba(0,0,0,0) 38%,rgba(0,0,0,.6) 100%);}
    .card{border:3px solid #000;border-radius:17px;background:linear-gradient(180deg,#1F1A15,#120F0C);
      box-shadow:0 7px 0 #000, inset 0 1px 0 rgba(255,183,101,.14);}
    .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;border:2px solid #000;
      font-size:9px;font-weight:900;letter-spacing:1.9px;}
    /* segmented stat meter */
    .meter{display:flex;gap:3px;}
    .pip{width:12px;height:9px;border-radius:2px;background:#2B241D;border:1px solid #000;}
    .pip-on{background:linear-gradient(180deg,var(--lite),var(--hot));}
    .stat-row{display:flex;align-items:center;justify-content:space-between;}
    .stat-n{font-size:9.5px;font-weight:900;letter-spacing:2.1px;color:var(--muted);}
  </style>
</helmet>

<div class="screen">

  <div style="position:absolute;left:50%;top:150px;width:640px;height:640px;margin-left:-320px;border-radius:50%;
              background:radial-gradient(circle,rgba(242,141,53,.16) 0%,rgba(0,0,0,0) 62%);"></div>
  <!-- garage floor -->
  <div style="position:absolute;left:0;right:0;top:470px;height:200px;
              background:linear-gradient(180deg,rgba(58,52,44,0),rgba(58,52,44,.30) 45%,rgba(58,52,44,0));"></div>

  <div style="position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;">
    <div style="height:66px;flex:none;"></div>

    <!-- header -->
    <div style="width:361px;flex:none;display:flex;align-items:center;gap:12px;">
      <div style="width:48px;height:48px;flex:none;border-radius:11px;border:2px solid #000;
                  background:linear-gradient(180deg,#241E17,#171310);box-shadow:0 4px 0 #000;
                  display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#F28D35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.6 5.4 8 12l6.6 6.6"/>
        </svg>
      </div>
      <div style="flex:1 1 auto;font-family:var(--display);font-size:36px;color:var(--lite);text-shadow:3px 4px 0 #000;">GARAGE</div>
      <div style="flex:none;padding:8px 14px;border-radius:9px;background:rgba(10,8,6,.85);border:2px solid #000;
                  box-shadow:0 3px 0 #000;display:flex;align-items:center;gap:8px;">
        <svg viewBox="0 0 24 24" width="19" height="19">
          <circle cx="12" cy="12" r="9.4" fill="#C98A0E"/>
          <circle cx="12" cy="12" r="9.4" fill="none" stroke="#6B4708" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="6.4" fill="#FFC93C"/>
          <path d="M9.4 12h5.2M12 9.4v5.2" stroke="#8A5B08" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        <span style="font-weight:900;font-size:19px;color:var(--gold);font-variant-numeric:tabular-nums;">1,240</span>
      </div>
    </div>

    <div style="height:26px;flex:none;"></div>

    <!-- ---------- carousel ---------- -->
    <div style="position:relative;width:393px;height:406px;flex:none;">

      <!-- LEFT PEEK: equipped -->
      <div class="card" style="position:absolute;left:-74px;top:34px;width:132px;height:326px;opacity:.6;padding:16px 12px;
                  display:flex;flex-direction:column;align-items:center;">
        <div class="chip" style="background:#1D3A22;color:#7FE59B;border-color:#000;">EQUIPPED</div>
        <img src="straycat.svg" alt="" style="margin-top:16px;width:60px;height:122px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.7));">
        <div style="margin-top:12px;font-family:var(--display);font-size:16px;color:var(--cream);">STRAY CAT</div>
      </div>

      <!-- RIGHT PEEK: owned, not equipped -->
      <div class="card" style="position:absolute;right:-74px;top:34px;width:132px;height:326px;opacity:.6;padding:16px 12px;
                  display:flex;flex-direction:column;align-items:center;">
        <div class="chip" style="background:#2A2118;color:var(--lite);">OWNED</div>
        <img src="hatpin.svg" alt="" style="margin-top:16px;width:50px;height:122px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.7));">
        <div style="margin-top:12px;font-family:var(--display);font-size:16px;color:var(--cream);">HATPIN</div>
      </div>

      <!-- CENTRE: locked, purchasable -->
      <div class="card" style="position:absolute;left:50%;top:0;width:249px;height:394px;margin-left:-124.5px;
                  padding:18px 18px 16px;display:flex;flex-direction:column;align-items:center;
                  border-color:#000;box-shadow:0 9px 0 #000, 0 0 34px rgba(247,117,3,.22), inset 0 1px 0 rgba(255,183,101,.2);">
        <div class="chip" style="background:#2E1512;color:#FF9A93;">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="#FF9A93" stroke-width="2.6" stroke-linecap="round">
            <rect x="4.6" y="10.4" width="14.8" height="10" rx="2"/><path d="M8.2 10.4V7.6a3.8 3.8 0 0 1 7.6 0v2.8"/>
          </svg>
          LOCKED
        </div>

        <div style="position:relative;margin-top:12px;">
          <div style="position:absolute;left:50%;top:56%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;
                      background:radial-gradient(circle,rgba(242,141,53,.26),rgba(0,0,0,0) 66%);"></div>
          <img src="boarhound.svg" alt="" style="position:relative;width:86px;height:153px;
               filter:drop-shadow(0 12px 12px rgba(0,0,0,.75)) grayscale(.55) brightness(.72);">
        </div>

        <div style="margin-top:12px;font-family:var(--display);font-size:27px;line-height:1;color:var(--lite);
                    text-shadow:2px 3px 0 #000;">BOARHOUND</div>
        <div style="margin-top:3px;font-size:10px;font-weight:800;letter-spacing:2.2px;color:var(--muted);">WIDEBODY · 72PT</div>

        <div style="width:100%;margin-top:15px;display:flex;flex-direction:column;gap:8px;">
          <div class="stat-row"><span class="stat-n">SPEED</span>
            <span class="meter"><i class="pip pip-on"></i><i class="pip pip-on"></i><i class="pip pip-on"></i><i class="pip pip-on"></i><i class="pip pip-on"></i><i class="pip pip-on"></i><i class="pip"></i></span>
          </div>
          <div class="stat-row"><span class="stat-n">HANDLING</span>
            <span class="meter"><i class="pip pip-on"></i><i class="pip pip-on"></i><i class="pip pip-on"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></span>
          </div>
          <div class="stat-row"><span class="stat-n">GRIP</span>
            <span class="meter"><i class="pip pip-on"></i><i class="pip pip-on"></i><i class="pip pip-on"></i><i class="pip pip-on"></i><i class="pip"></i><i class="pip"></i></span>
          </div>
        </div>
      </div>
    </div>

    <div style="height:16px;flex:none;"></div>

    <!-- pager -->
    <div style="flex:none;display:flex;gap:7px;align-items:center;">
      <div style="width:8px;height:8px;border-radius:50%;background:#3A342E;border:1.5px solid #000;"></div>
      <div style="width:24px;height:8px;border-radius:4px;background:var(--orange);border:1.5px solid #000;"></div>
      <div style="width:8px;height:8px;border-radius:50%;background:#3A342E;border:1.5px solid #000;"></div>
      <div style="width:8px;height:8px;border-radius:50%;background:#3A342E;border:1.5px solid #000;"></div>
      <div style="width:8px;height:8px;border-radius:50%;background:#3A342E;border:1.5px solid #000;"></div>
    </div>

    <div style="flex:1 1 auto;"></div>

    <!-- buy -->
    <div style="width:337px;flex:none;height:74px;border-radius:14px;
                background:linear-gradient(180deg,#FFC684 0%,var(--orange) 42%,var(--hot) 100%);
                border:3px solid #000;box-shadow:0 8px 0 #000, 0 13px 24px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.4);
                display:flex;align-items:center;justify-content:center;gap:13px;">
      <span style="font-family:var(--display);font-size:31px;color:#1A0F04;letter-spacing:1.4px;">BUY</span>
      <span style="display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:8px;background:rgba(26,15,4,.85);">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <circle cx="12" cy="12" r="9.4" fill="#C98A0E"/>
          <circle cx="12" cy="12" r="6.4" fill="#FFC93C"/>
          <path d="M9.4 12h5.2M12 9.4v5.2" stroke="#8A5B08" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        <span style="font-weight:900;font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums;">1,200</span>
      </span>
    </div>

    <div style="height:52px;flex:none;"></div>
  </div>

  <div class="scan"></div>
  <div class="vig"></div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
