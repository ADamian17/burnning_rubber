<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Underdog&family=Outfit:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root{
      --ink:#0A0806; --panel:#14100C; --panel2:#1E1813; --edge:#3A2E22;
      --orange:#F28D35; --hot:#f77503; --lite:#FFB765;
      --cream:#F5EFE4; --muted:#9C9184;
      --red:#E4322B; --gold:#FFC93C; --cyan:#35D6F2; --magenta:#F2359B;
      --lane:#EFE9DC;
      --display:'Underdog','Chalkboard SE','Comic Sans MS',cursive;
      --ui:'Outfit','Avenir Next','Segoe UI',system-ui,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--ui);background:#000;color:var(--cream);-webkit-font-smoothing:antialiased;}
    a{color:var(--orange);} a:hover{color:var(--hot);}
    .screen{position:relative;width:393px;height:852px;overflow:hidden;background:var(--ink);}
    .scan{position:absolute;inset:0;z-index:90;pointer-events:none;
      background:repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1px,rgba(0,0,0,0) 1px 3px);}
    .vig{position:absolute;inset:0;z-index:91;pointer-events:none;
      background:radial-gradient(125% 78% at 50% 46%,rgba(0,0,0,0) 36%,rgba(0,0,0,.62) 100%);}
    .plate{background:rgba(10,8,6,.82);border:2px solid #000;border-radius:9px;
      box-shadow:0 3px 0 #000, inset 0 1px 0 rgba(255,183,101,.16);}
    .lbl{font-size:9.5px;font-weight:800;letter-spacing:2.3px;color:var(--muted);}
    .num{font-weight:900;font-variant-numeric:tabular-nums;}
    /* secondary button */
    .sec{flex:1 1 0;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
      background:linear-gradient(180deg,#221C16,#161210);border:2px solid #000;border-radius:11px;
      box-shadow:0 4px 0 #000, inset 0 1px 0 rgba(255,183,101,.14);
      font-size:10px;font-weight:900;letter-spacing:1.9px;color:var(--cream);}
  </style>
</helmet>

<div class="screen">

  <div style="position:absolute;left:50%;top:170px;width:700px;height:700px;margin-left:-350px;border-radius:50%;
              background:radial-gradient(circle,rgba(242,141,53,.24) 0%,rgba(247,117,3,.07) 44%,rgba(0,0,0,0) 68%);"></div>

  <!-- road running off the bottom of the screen -->
  <div style="position:absolute;left:0;right:0;bottom:0;height:330px;overflow:hidden;
              background:linear-gradient(180deg,rgba(38,36,31,0) 0%,#26241F 26%,#1E1C18 100%);">
    <div style="position:absolute;left:98.25px;top:40px;bottom:-40px;width:7px;margin-left:-3.5px;opacity:.5;
      background:repeating-linear-gradient(180deg,var(--lane) 0 48px,rgba(0,0,0,0) 48px 112px);"></div>
    <div style="position:absolute;left:196.5px;top:40px;bottom:-40px;width:7px;margin-left:-3.5px;opacity:.5;
      background:repeating-linear-gradient(180deg,var(--lane) 0 48px,rgba(0,0,0,0) 48px 112px);"></div>
    <div style="position:absolute;left:294.75px;top:40px;bottom:-40px;width:7px;margin-left:-3.5px;opacity:.5;
      background:repeating-linear-gradient(180deg,var(--lane) 0 48px,rgba(0,0,0,0) 48px 112px);"></div>
  </div>
  <img src="straycat.svg" alt="" style="position:absolute;left:117px;bottom:-26px;width:60px;height:122px;opacity:.34;
       filter:drop-shadow(0 8px 12px rgba(0,0,0,.7));">

  <div style="position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;">
    <div style="height:66px;flex:none;"></div>

    <!-- persistent top strip -->
    <div style="width:361px;flex:none;display:flex;gap:9px;">
      <div class="plate" style="flex:1 1 0;padding:8px 14px 9px;">
        <div class="lbl">BEST</div>
        <div class="num" style="font-size:22px;color:var(--lite);text-shadow:0 2px 0 #000;">12,480</div>
      </div>
      <div class="plate" style="padding:8px 15px 9px;display:flex;align-items:center;gap:9px;">
        <svg viewBox="0 0 24 24" width="21" height="21">
          <circle cx="12" cy="12" r="9.4" fill="#C98A0E"/>
          <circle cx="12" cy="12" r="9.4" fill="none" stroke="#6B4708" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="6.4" fill="#FFC93C"/>
          <path d="M9.4 12h5.2M12 9.4v5.2" stroke="#8A5B08" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        <span class="num" style="font-size:22px;color:var(--gold);text-shadow:0 2px 0 #000;">1,240</span>
      </div>
    </div>

    <div style="height:54px;flex:none;"></div>

    <!-- logo -->
    <div style="text-align:center;flex:none;transform:rotate(-3deg);">
      <div style="font-family:var(--display);font-size:47px;line-height:.94;color:var(--orange);
                  text-shadow:4px 5px 0 #000, 0 0 30px rgba(247,117,3,.45);">BURNING</div>
      <div style="font-family:var(--display);font-size:63px;line-height:.96;color:var(--lite);
                  text-shadow:5px 6px 0 #000, 0 0 34px rgba(247,117,3,.5);">RUBBER</div>
      <div style="margin-top:14px;display:flex;align-items:center;justify-content:center;gap:2px;
                  font-family:var(--display);font-size:17px;color:var(--muted);text-shadow:2px 3px 0 #000;">
        <span>&ldquo;FEAR THE R</span>
        <svg viewBox="0 0 40 40" width="19" height="19" style="display:block;margin:0 1px;">
          <circle cx="20" cy="20" r="18.5" fill="#131110"/>
          <circle cx="20" cy="20" r="15" fill="none" stroke="#2E2A26" stroke-width="5.5" stroke-dasharray="3 4.4"/>
          <circle cx="20" cy="20" r="9.6" fill="#B7B1A8"/>
          <g stroke="#7C776F" stroke-width="2" stroke-linecap="round">
            <line x1="20" y1="11" x2="20" y2="29"/><line x1="11" y1="20" x2="29" y2="20"/>
            <line x1="13.6" y1="13.6" x2="26.4" y2="26.4"/><line x1="26.4" y1="13.6" x2="13.6" y2="26.4"/>
          </g>
        </svg>
        <span>AD&rdquo;</span>
      </div>
    </div>

    <div style="flex:1 1 auto;"></div>

    <!-- PLAY: the unmistakable primary -->
    <div style="width:361px;flex:none;height:88px;border-radius:15px;position:relative;
                background:linear-gradient(180deg,#FFC684 0%,var(--orange) 42%,var(--hot) 100%);
                border:3px solid #000;
                box-shadow:0 8px 0 #000, 0 14px 26px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.4);
                display:flex;align-items:center;justify-content:center;gap:14px;">
      <svg viewBox="0 0 24 24" width="27" height="27">
        <path d="M7 4.4 19.5 12 7 19.6z" fill="#1A0F04"/>
      </svg>
      <span style="font-family:var(--display);font-size:44px;color:#1A0F04;letter-spacing:2px;
                   text-shadow:0 2px 0 rgba(255,255,255,.35);">PLAY</span>
    </div>

    <div style="height:14px;flex:none;"></div>

    <!-- secondaries -->
    <div style="width:361px;flex:none;display:flex;gap:11px;">
      <div class="sec">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#F28D35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20V9.6l9-5.2 9 5.2V20"/><path d="M3 20h18"/><path d="M8.5 20v-6h7v6"/>
        </svg>
        <span>GARAGE</span>
      </div>
      <div class="sec">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#F28D35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6h.08A1.7 1.7 0 0 0 10 3.04V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.08a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/>
        </svg>
        <span>SETTINGS</span>
      </div>
      <div class="sec">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#F28D35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 16v-4.6"/><path d="M12 8.2h.01"/>
        </svg>
        <span>CREDITS</span>
      </div>
    </div>

    <!-- bottom gap left empty for the real home indicator -->
    <div style="height:56px;flex:none;"></div>
  </div>

  <div class="scan"></div>
  <div class="vig"></div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
