<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Underdog&family=Outfit:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root{
      --ink:#0A0806; --panel:#14100C; --panel2:#1E1813; --edge:#3A2E22;
      --orange:#F28D35; --hot:#f77503; --lite:#FFB765;
      --cream:#F5EFE4; --muted:#9C9184;
      --red:#E4322B; --gold:#FFC93C; --cyan:#35D6F2; --magenta:#F2359B;
      --asphalt:#26241F; --lane:#EFE9DC;
      --display:'Underdog','Chalkboard SE','Comic Sans MS',cursive;
      --ui:'Outfit','Avenir Next','Segoe UI',system-ui,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--ui);background:#000;color:var(--cream);-webkit-font-smoothing:antialiased;}
    a{color:var(--orange);} a:hover{color:var(--hot);}
    .screen{position:relative;width:393px;height:852px;overflow:hidden;background:var(--ink);}
    .scan{position:absolute;inset:0;z-index:90;pointer-events:none;
      background:repeating-linear-gradient(180deg,rgba(0,0,0,.20) 0 1px,rgba(0,0,0,0) 1px 3px);}
    .vig{position:absolute;inset:0;z-index:91;pointer-events:none;
      background:radial-gradient(125% 80% at 50% 50%,rgba(0,0,0,0) 44%,rgba(0,0,0,.55) 100%);}

    /* --- road --- */
    .road{position:absolute;inset:0;background:linear-gradient(180deg,#1C1A17 0%,#2B2823 18%,#26241F 60%,#221F1B 100%);}
    .dash{position:absolute;top:-60px;bottom:-60px;width:7px;margin-left:-3.5px;opacity:.88;
      background:repeating-linear-gradient(180deg,var(--lane) 0 48px,rgba(0,0,0,0) 48px 112px);}
    .rumble{position:absolute;top:-60px;bottom:-60px;width:11px;opacity:.8;
      background:repeating-linear-gradient(180deg,var(--lane) 0 28px,#B8342C 28px 56px);}
    .streak{position:absolute;width:3px;border-radius:2px;
      background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.16),rgba(255,255,255,0));}

    /* --- HUD plates --- */
    .plate{background:rgba(10,8,6,.82);border:2px solid #000;border-radius:9px;
      box-shadow:0 3px 0 #000, 0 6px 16px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,183,101,.18);
      backdrop-filter:blur(3px);}
    .lbl{font-size:9.5px;font-weight:800;letter-spacing:2.3px;color:var(--muted);}
    .num{font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.5px;color:var(--cream);
      text-shadow:0 2px 0 rgba(0,0,0,.9);}
  </style>
</helmet>

<div class="screen">

  <!-- ================= ROAD (edge to edge, runs behind the HUD) ================= -->
  <div class="road">
    <!-- lighter concrete stretch: proves HUD plates carry their own contrast -->
    <div style="position:absolute;left:0;right:0;top:96px;height:250px;
                background:linear-gradient(180deg,rgba(180,172,158,0) 0%,rgba(180,172,158,.30) 22%,rgba(180,172,158,.30) 78%,rgba(180,172,158,0) 100%);"></div>
    <div style="position:absolute;left:0;right:0;top:520px;height:120px;
                background:linear-gradient(180deg,rgba(150,142,130,0),rgba(150,142,130,.14),rgba(150,142,130,0));"></div>

    <!-- 4 lanes: boundaries at 98.25 / 196.5 / 294.75 -->
    <div class="dash" style="left:98.25px;"></div>
    <div class="dash" style="left:196.5px;"></div>
    <div class="dash" style="left:294.75px;"></div>
    <div class="rumble" style="left:0;"></div>
    <div class="rumble" style="right:0;"></div>

    <div class="streak" style="left:70px;top:430px;height:120px;"></div>
    <div class="streak" style="left:320px;top:210px;height:90px;"></div>
    <div class="streak" style="left:170px;top:600px;height:140px;"></div>
  </div>

  <!-- ================= TRAFFIC ================= -->
  <!-- lane 3 (centre 245) -->
  <img src="traffic-patrol.svg" alt="" style="position:absolute;left:214px;top:74px;width:62px;height:128px;
       filter:drop-shadow(0 12px 10px rgba(0,0,0,.6));transform:rotate(180deg);">
  <!-- lane 1 (centre 49) -->
  <img src="traffic-sedan.svg" alt="" style="position:absolute;left:18px;top:196px;width:62px;height:128px;
       filter:drop-shadow(0 12px 10px rgba(0,0,0,.6));transform:rotate(180deg);">
  <!-- lane 4 (centre 344) -->
  <img src="traffic-van.svg" alt="" style="position:absolute;left:309px;top:322px;width:70px;height:158px;
       filter:drop-shadow(0 14px 12px rgba(0,0,0,.6));transform:rotate(180deg);">
  <!-- lane 1 far (centre 49) -->
  <img src="traffic-box.svg" alt="" style="position:absolute;left:12px;top:558px;width:74px;height:182px;
       filter:drop-shadow(0 12px 10px rgba(0,0,0,.6));transform:rotate(180deg);">

  <!-- coin pickup in lane 3 -->
  <div style="position:absolute;left:231px;top:470px;width:28px;height:28px;border-radius:50%;
              background:radial-gradient(circle at 34% 30%,#FFE9A8,var(--gold) 48%,#C98A0E 100%);
              border:2px solid #6B4708;box-shadow:0 0 16px 3px rgba(255,201,60,.5), 0 4px 0 rgba(0,0,0,.5);"></div>

  <!-- ================= PLAYER (lane 2, centre 147) ================= -->
  <div style="position:absolute;left:115px;top:648px;width:64px;height:130px;">
    <div style="position:absolute;left:-6px;top:112px;width:76px;height:20px;border-radius:50%;
                background:radial-gradient(ellipse,rgba(0,0,0,.6),rgba(0,0,0,0) 70%);"></div>
    <img src="straycat.svg" alt="" style="position:relative;width:60px;height:122px;
         filter:drop-shadow(0 8px 10px rgba(0,0,0,.65));">
    <!-- exhaust heat -->
    <div style="position:absolute;left:12px;top:124px;width:14px;height:34px;border-radius:50%;
                background:linear-gradient(180deg,rgba(247,117,3,.55),rgba(247,117,3,0));filter:blur(3px);"></div>
    <div style="position:absolute;left:38px;top:124px;width:14px;height:34px;border-radius:50%;
                background:linear-gradient(180deg,rgba(247,117,3,.55),rgba(247,117,3,0));filter:blur(3px);"></div>
  </div>

  <!-- ================= HUD (everything lives above y=554) ================= -->

  <!-- top row: safe-area gap above is left empty for the real status bar -->
  <div style="position:absolute;left:16px;top:68px;z-index:40;">
    <div class="plate" style="padding:9px 15px 10px;">
      <div class="lbl">SCORE</div>
      <div class="num" style="font-size:34px;line-height:1.02;color:var(--lite);
           text-shadow:0 3px 0 #000, 0 0 20px rgba(247,117,3,.4);">08,420</div>
    </div>
    <div class="plate" style="margin-top:8px;padding:7px 15px 8px;display:inline-block;">
      <span class="lbl">DIST</span>
      <span class="num" style="font-size:17px;margin-left:8px;">2.4</span>
      <span style="font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.4px;margin-left:2px;">KM</span>
    </div>
  </div>

  <div style="position:absolute;right:16px;top:68px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
    <!-- pause: 48x48 hit target -->
    <div class="plate" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 24 24" width="21" height="21">
        <rect x="6.5" y="4.5" width="4.2" height="15" rx="1.6" fill="#F5EFE4"/>
        <rect x="13.3" y="4.5" width="4.2" height="15" rx="1.6" fill="#F5EFE4"/>
      </svg>
    </div>
    <!-- coins -->
    <div class="plate" style="padding:7px 13px 7px 9px;display:flex;align-items:center;gap:8px;">
      <svg viewBox="0 0 24 24" width="19" height="19">
        <circle cx="12" cy="12" r="9.4" fill="#C98A0E"/>
        <circle cx="12" cy="12" r="9.4" fill="none" stroke="#6B4708" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="6.4" fill="#FFC93C"/>
        <path d="M9.4 12h5.2M12 9.4v5.2" stroke="#8A5B08" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
      <span class="num" style="font-size:19px;color:var(--gold);">128</span>
    </div>
  </div>

  <!-- power-up pill with draining timer -->
  <div style="position:absolute;left:50%;top:196px;transform:translateX(-50%);z-index:40;">
    <div class="plate" style="padding:8px 14px 9px;display:flex;align-items:center;gap:10px;
         border-color:#000;box-shadow:0 3px 0 #000, 0 0 22px rgba(53,214,242,.28), inset 0 1px 0 rgba(53,214,242,.28);">
      <svg viewBox="0 0 24 24" width="19" height="19">
        <path d="M12 3.2 19.4 6v6.1c0 4.5-3.1 7.3-7.4 8.7-4.3-1.4-7.4-4.2-7.4-8.7V6z"
              fill="none" stroke="#35D6F2" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <div>
        <div style="font-size:10px;font-weight:900;letter-spacing:2.2px;color:var(--cyan);">SHIELD</div>
        <div style="width:104px;height:6px;margin-top:5px;border-radius:3px;background:#0B0908;
                    border:1px solid #000;overflow:hidden;">
          <div style="width:58%;height:100%;background:linear-gradient(90deg,#8BE9FA,var(--cyan));"></div>
        </div>
      </div>
      <span class="num" style="font-size:15px;color:var(--cyan);">4.6</span>
    </div>
  </div>

  <!-- combo multiplier: fires mid-screen, still clear of the thumb zone -->
  <div style="position:absolute;left:50%;top:372px;transform:translateX(-50%) rotate(-7deg);z-index:40;text-align:center;">
    <div style="position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;
                background:radial-gradient(circle,rgba(247,117,3,.42) 0%,rgba(247,117,3,0) 62%);"></div>
    <div style="position:relative;font-family:var(--display);font-size:76px;line-height:.9;color:var(--lite);
                text-shadow:5px 6px 0 #000, 0 0 30px rgba(247,117,3,.8);">&times;3</div>
    <div style="position:relative;margin-top:2px;font-size:11px;font-weight:900;letter-spacing:3.4px;
                color:var(--orange);text-shadow:2px 2px 0 #000;">NEAR MISS</div>
  </div>

  <div class="scan"></div>
  <div class="vig"></div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
