<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Underdog&family=Outfit:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root{
      --ink:#0A0806; --orange:#F28D35; --hot:#f77503; --lite:#FFB765;
      --cream:#F5EFE4; --muted:#9C9184; --gold:#FFC93C; --cyan:#35D6F2;
      --lane:#EFE9DC;
      --display:'Underdog','Chalkboard SE','Comic Sans MS',cursive;
      --ui:'Outfit','Avenir Next','Segoe UI',system-ui,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--ui);background:#000;color:var(--cream);-webkit-font-smoothing:antialiased;}
    a{color:var(--orange);} a:hover{color:var(--hot);}
    .screen{position:relative;width:393px;height:852px;overflow:hidden;background:var(--ink);}
    .scan{position:absolute;inset:0;z-index:90;pointer-events:none;
      background:repeating-linear-gradient(180deg,rgba(0,0,0,.20) 0 1px,rgba(0,0,0,0) 1px 3px);}
    .vig{position:absolute;inset:0;z-index:91;pointer-events:none;
      background:radial-gradient(125% 80% at 50% 48%,rgba(0,0,0,0) 42%,rgba(0,0,0,.58) 100%);}

    /* the finger and the car sweep together, so the mapping reads as 1:1 */
    @keyframes sweep{
      0%,8%   {transform:translateX(-96px);}
      46%,54% {transform:translateX(96px);}
      92%,100%{transform:translateX(-96px);}
    }
    @keyframes pulse{
      0%   {transform:scale(.55);opacity:.85;}
      100% {transform:scale(1.7);opacity:0;}
    }
    .sweeper{animation:sweep 3.6s ease-in-out infinite;}
    .ring{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;
      border:3px solid var(--lite);animation:pulse 1.8s ease-out infinite;}
  </style>
</helmet>

<div class="screen">

  <div style="position:absolute;left:50%;top:120px;width:660px;height:660px;margin-left:-330px;border-radius:50%;
              background:radial-gradient(circle,rgba(242,141,53,.18) 0%,rgba(0,0,0,0) 62%);"></div>

  <div style="position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;">
    <div style="height:78px;flex:none;"></div>

    <div style="flex:none;text-align:center;">
      <div style="font-size:10px;font-weight:900;letter-spacing:3.6px;color:var(--orange);">HOW IT WORKS</div>
      <div style="margin-top:9px;font-family:var(--display);font-size:44px;line-height:1;color:var(--lite);
                  text-shadow:4px 5px 0 #000;">HOW TO DRIVE</div>
    </div>

    <div style="height:30px;flex:none;"></div>

    <!-- road demo strip -->
    <div style="position:relative;width:361px;height:352px;flex:none;border-radius:16px;overflow:hidden;
                border:3px solid #000;box-shadow:0 7px 0 #000, inset 0 0 40px rgba(0,0,0,.7);
                background:linear-gradient(180deg,#1C1A17,#2B2823 24%,#26241F);">
      <div style="position:absolute;left:90.25px;top:-30px;bottom:-30px;width:6px;margin-left:-3px;opacity:.75;
        background:repeating-linear-gradient(180deg,var(--lane) 0 44px,rgba(0,0,0,0) 44px 100px);"></div>
      <div style="position:absolute;left:180.5px;top:-30px;bottom:-30px;width:6px;margin-left:-3px;opacity:.75;
        background:repeating-linear-gradient(180deg,var(--lane) 0 44px,rgba(0,0,0,0) 44px 100px);"></div>
      <div style="position:absolute;left:270.75px;top:-30px;bottom:-30px;width:6px;margin-left:-3px;opacity:.75;
        background:repeating-linear-gradient(180deg,var(--lane) 0 44px,rgba(0,0,0,0) 44px 100px);"></div>

      <img src="traffic-sedan.svg" alt="" style="position:absolute;left:13px;top:20px;width:62px;height:128px;
           filter:drop-shadow(0 10px 9px rgba(0,0,0,.6));transform:rotate(180deg);">
      <img src="traffic-van.svg" alt="" style="position:absolute;left:246px;top:-6px;width:70px;height:158px;
           filter:drop-shadow(0 10px 9px rgba(0,0,0,.6));transform:rotate(180deg);">

      <!-- the car -->
      <div class="sweeper" style="position:absolute;left:148px;top:186px;width:60px;height:122px;">
        <img src="straycat.svg" alt="" style="width:60px;height:122px;filter:drop-shadow(0 8px 9px rgba(0,0,0,.7));">
      </div>

      <!-- drag path -->
      <svg viewBox="0 0 361 352" width="361" height="352" style="position:absolute;inset:0;">
        <path d="M78 300 Q180 270 282 300" fill="none" stroke="#FFB765" stroke-width="3"
              stroke-linecap="round" stroke-dasharray="2 10" opacity=".7"/>
      </svg>

      <!-- the finger -->
      <div class="sweeper" style="position:absolute;left:180.5px;top:294px;">
        <div style="position:relative;width:0;height:0;">
          <div class="ring"></div>
          <div style="position:absolute;left:-27px;top:-27px;width:54px;height:54px;border-radius:50%;
                      background:radial-gradient(circle at 36% 32%,rgba(255,255,255,.9),rgba(255,183,101,.75) 46%,rgba(247,117,3,.55));
                      border:2.5px solid #000;box-shadow:0 4px 0 rgba(0,0,0,.7), 0 0 28px rgba(247,117,3,.6);"></div>
        </div>
      </div>

      <div style="position:absolute;left:0;right:0;bottom:0;height:96px;
                  background:linear-gradient(180deg,rgba(10,8,6,0),rgba(10,8,6,.55));"></div>
      <div style="position:absolute;left:0;right:0;bottom:11px;text-align:center;
                  font-size:9.5px;font-weight:900;letter-spacing:2.8px;color:var(--muted);">THUMB ZONE &mdash; BOTTOM 35%</div>
    </div>

    <div style="height:26px;flex:none;"></div>

    <div style="width:321px;flex:none;text-align:center;">
      <div style="font-family:var(--display);font-size:29px;color:var(--orange);text-shadow:3px 4px 0 #000;">DRAG TO STEER</div>
      <div style="margin-top:11px;font-size:15px;line-height:1.5;color:var(--muted);text-wrap:pretty;">
        Hold your thumb anywhere near the bottom and slide. The car tracks your finger &mdash; no buttons, no lifting off.
      </div>
    </div>

    <div style="flex:1 1 auto;"></div>

    <div style="width:361px;flex:none;height:66px;border-radius:14px;
                background:linear-gradient(180deg,#FFC684 0%,var(--orange) 42%,var(--hot) 100%);
                border:3px solid #000;box-shadow:0 7px 0 #000, 0 12px 22px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.4);
                display:flex;align-items:center;justify-content:center;">
      <span style="font-family:var(--display);font-size:30px;color:#1A0F04;letter-spacing:1.5px;">GOT IT</span>
    </div>

    <div style="height:46px;flex:none;"></div>
  </div>

  <div class="scan"></div>
  <div class="vig"></div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
