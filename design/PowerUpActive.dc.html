<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Underdog&family=Outfit:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root{
      --ink:#0A0806; --orange:#F28D35; --hot:#f77503; --lite:#FFB765;
      --cream:#F5EFE4; --muted:#9C9184; --gold:#FFC93C; --cyan:#35D6F2; --magenta:#F2359B;
      --lane:#EFE9DC;
      --display:'Underdog','Chalkboard SE','Comic Sans MS',cursive;
      --ui:'Outfit','Avenir Next','Segoe UI',system-ui,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--ui);background:#000;color:var(--cream);-webkit-font-smoothing:antialiased;}
    a{color:var(--orange);} a:hover{color:var(--hot);}
    .screen{position:relative;width:393px;height:852px;overflow:hidden;background:var(--ink);}
    .scan{position:absolute;inset:0;z-index:90;pointer-events:none;
      background:repeating-linear-gradient(180deg,rgba(0,0,0,.20) 0 1px,rgba(0,0,0,0) 1px 3px);}
    .vig{position:absolute;inset:0;z-index:91;pointer-events:none;
      background:radial-gradient(125% 80% at 50% 50%,rgba(0,0,0,0) 44%,rgba(0,0,0,.55) 100%);}
    .dash{position:absolute;top:-60px;bottom:-60px;width:7px;margin-left:-3.5px;opacity:.88;
      background:repeating-linear-gradient(180deg,var(--lane) 0 48px,rgba(0,0,0,0) 48px 112px);}
    .rumble{position:absolute;top:-60px;bottom:-60px;width:11px;opacity:.8;
      background:repeating-linear-gradient(180deg,var(--lane) 0 28px,#B8342C 28px 56px);}
    .plate{background:rgba(10,8,6,.82);border:2px solid #000;border-radius:9px;
      box-shadow:0 3px 0 #000, 0 6px 16px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,183,101,.18);}
    .lbl{font-size:9.5px;font-weight:800;letter-spacing:2.3px;color:var(--muted);}
    .num{font-weight:900;font-variant-numeric:tabular-nums;color:var(--cream);text-shadow:0 2px 0 rgba(0,0,0,.9);}
    .pill{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:9px;
      background:rgba(10,8,6,.85);border:2px solid #000;box-shadow:0 3px 0 #000;}
    .bar{width:78px;height:5px;border-radius:3px;background:#0B0908;border:1px solid #000;overflow:hidden;}
    .cap{font-size:9px;font-weight:900;letter-spacing:2px;}
    .coin{position:absolute;width:22px;height:22px;border-radius:50%;
      background:radial-gradient(circle at 34% 30%,#FFE9A8,var(--gold) 48%,#C98A0E 100%);
      border:2px solid #6B4708;box-shadow:0 0 14px 3px rgba(255,201,60,.55);}
  </style>
</helmet>

<div class="screen">

  <!-- road -->
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,#1C1A17 0%,#2B2823 18%,#26241F 60%,#221F1B 100%);">
    <div class="dash" style="left:98.25px;"></div>
    <div class="dash" style="left:196.5px;"></div>
    <div class="dash" style="left:294.75px;"></div>
    <div class="rumble" style="left:0;"></div>
    <div class="rumble" style="right:0;"></div>
  </div>

  <!-- traffic, motion-smeared by slow-mo -->
  <img src="traffic-patrol.svg" alt="" style="position:absolute;left:214px;top:110px;width:62px;height:128px;
       filter:drop-shadow(0 12px 10px rgba(0,0,0,.6));transform:rotate(180deg);">
  <img src="traffic-box.svg" alt="" style="position:absolute;left:12px;top:250px;width:74px;height:182px;
       filter:drop-shadow(0 12px 10px rgba(0,0,0,.6));transform:rotate(180deg);">

  <!-- ================= SLOW-MO: full-screen colour wash ================= -->
  <div style="position:absolute;inset:0;z-index:20;pointer-events:none;
              background:linear-gradient(180deg,rgba(53,214,242,.20) 0%,rgba(23,86,140,.26) 55%,rgba(53,214,242,.16) 100%);
              mix-blend-mode:screen;"></div>
  <div style="position:absolute;inset:0;z-index:21;pointer-events:none;
              background:radial-gradient(120% 70% at 50% 78%,rgba(53,214,242,0) 30%,rgba(53,214,242,.30) 100%);"></div>
  <!-- horizontal time-slip bands -->
  <div style="position:absolute;inset:0;z-index:22;pointer-events:none;opacity:.5;
              background:repeating-linear-gradient(180deg,rgba(139,233,250,.16) 0 2px,rgba(0,0,0,0) 2px 14px);"></div>

  <!-- ================= MAGNET: coins arcing into the car ================= -->
  <svg viewBox="0 0 393 852" width="393" height="852" style="position:absolute;inset:0;z-index:30;">
    <g fill="none" stroke="#F2359B" stroke-width="2.5" stroke-linecap="round" opacity=".75">
      <path d="M62 566 Q104 640 141 700" stroke-dasharray="3 9"/>
      <path d="M262 528 Q214 618 156 698" stroke-dasharray="3 9"/>
      <path d="M334 622 Q248 664 162 706" stroke-dasharray="3 9"/>
      <path d="M198 476 Q178 592 150 692" stroke-dasharray="3 9"/>
    </g>
  </svg>
  <div class="coin" style="left:52px;top:556px;z-index:31;"></div>
  <div class="coin" style="left:252px;top:518px;z-index:31;"></div>
  <div class="coin" style="left:324px;top:612px;z-index:31;"></div>
  <div class="coin" style="left:188px;top:466px;z-index:31;"></div>
  <div style="position:absolute;left:147px;top:713px;width:300px;height:300px;margin:-150px 0 0 -150px;z-index:29;
              border-radius:50%;background:radial-gradient(circle,rgba(242,53,155,.24) 0%,rgba(242,53,155,0) 62%);"></div>

  <!-- ================= PLAYER + SHIELD BUBBLE ================= -->
  <div style="position:absolute;left:147px;top:713px;z-index:33;">
    <div style="position:absolute;width:172px;height:196px;margin:-98px 0 0 -86px;border-radius:50%;
                background:radial-gradient(circle,rgba(53,214,242,.10) 0%,rgba(53,214,242,.30) 62%,rgba(53,214,242,.06) 78%,rgba(0,0,0,0) 100%);
                border:3px solid rgba(139,233,250,.95);
                box-shadow:0 0 34px 8px rgba(53,214,242,.55), inset 0 0 32px rgba(53,214,242,.55);"></div>
    <div style="position:absolute;width:150px;height:174px;margin:-87px 0 0 -75px;border-radius:50%;
                border:1.5px solid rgba(255,255,255,.4);"></div>
    <!-- hex facet hint on the bubble -->
    <div style="position:absolute;width:172px;height:196px;margin:-98px 0 0 -86px;border-radius:50%;opacity:.45;
                background:repeating-linear-gradient(60deg,rgba(139,233,250,.4) 0 1px,rgba(0,0,0,0) 1px 17px),
                           repeating-linear-gradient(-60deg,rgba(139,233,250,.4) 0 1px,rgba(0,0,0,0) 1px 17px);"></div>
    <img src="straycat.svg" alt="" style="position:absolute;left:-30px;top:-65px;width:60px;height:122px;
         filter:drop-shadow(0 8px 10px rgba(0,0,0,.65));">
  </div>

  <!-- ================= HUD (all above y=554) ================= -->
  <div style="position:absolute;left:16px;top:68px;z-index:40;">
    <div class="plate" style="padding:9px 15px 10px;">
      <div class="lbl">SCORE</div>
      <div class="num" style="font-size:34px;line-height:1.02;color:var(--lite);
           text-shadow:0 3px 0 #000, 0 0 20px rgba(247,117,3,.4);">11,960</div>
    </div>
    <div class="plate" style="margin-top:8px;padding:7px 15px 8px;display:inline-block;">
      <span class="lbl">DIST</span>
      <span class="num" style="font-size:17px;margin-left:8px;">3.1</span>
      <span style="font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.4px;margin-left:2px;">KM</span>
    </div>
  </div>

  <div style="position:absolute;right:16px;top:68px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
    <div class="plate" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 24 24" width="21" height="21">
        <rect x="6.5" y="4.5" width="4.2" height="15" rx="1.6" fill="#F5EFE4"/>
        <rect x="13.3" y="4.5" width="4.2" height="15" rx="1.6" fill="#F5EFE4"/>
      </svg>
    </div>
    <div class="plate" style="padding:7px 13px 7px 9px;display:flex;align-items:center;gap:8px;">
      <svg viewBox="0 0 24 24" width="19" height="19">
        <circle cx="12" cy="12" r="9.4" fill="#C98A0E"/>
        <circle cx="12" cy="12" r="9.4" fill="none" stroke="#6B4708" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="6.4" fill="#FFC93C"/>
        <path d="M9.4 12h5.2M12 9.4v5.2" stroke="#8A5B08" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
      <span class="num" style="font-size:19px;color:var(--gold);">176</span>
    </div>
  </div>

  <!-- three pills stack while stacked power-ups run -->
  <div style="position:absolute;left:50%;top:196px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:7px;">
    <div class="pill" style="box-shadow:0 3px 0 #000, 0 0 20px rgba(53,214,242,.3);">
      <svg viewBox="0 0 24 24" width="17" height="17">
        <path d="M12 3.2 19.4 6v6.1c0 4.5-3.1 7.3-7.4 8.7-4.3-1.4-7.4-4.2-7.4-8.7V6z" fill="none" stroke="#35D6F2" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <div><div class="cap" style="color:var(--cyan);">SHIELD</div>
        <div class="bar" style="margin-top:4px;"><div style="width:72%;height:100%;background:linear-gradient(90deg,#8BE9FA,var(--cyan));"></div></div>
      </div>
      <span class="num" style="font-size:13px;color:var(--cyan);">5.8</span>
    </div>
    <div class="pill" style="box-shadow:0 3px 0 #000, 0 0 20px rgba(139,233,250,.22);">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#8BE9FA" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12.6" r="8.4"/><path d="M12 8.2v4.6l3 1.9"/><path d="M9.2 2.6h5.6"/>
      </svg>
      <div><div class="cap" style="color:#8BE9FA;">SLOW-MO</div>
        <div class="bar" style="margin-top:4px;"><div style="width:41%;height:100%;background:linear-gradient(90deg,#CFF6FE,#8BE9FA);"></div></div>
      </div>
      <span class="num" style="font-size:13px;color:#8BE9FA;">3.2</span>
    </div>
    <div class="pill" style="box-shadow:0 3px 0 #000, 0 0 20px rgba(242,53,155,.28);">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#F2359B" stroke-width="2" stroke-linecap="round">
        <path d="M6 4.6v7.8a6 6 0 0 0 12 0V4.6"/><path d="M6 9.4h4.4"/><path d="M13.6 9.4H18"/>
      </svg>
      <div><div class="cap" style="color:var(--magenta);">MAGNET</div>
        <div class="bar" style="margin-top:4px;"><div style="width:88%;height:100%;background:linear-gradient(90deg,#FF8FC8,var(--magenta));"></div></div>
      </div>
      <span class="num" style="font-size:13px;color:var(--magenta);">7.1</span>
    </div>
  </div>

  <!-- combo -->
  <div style="position:absolute;left:50%;top:392px;transform:translateX(-50%) rotate(-7deg);z-index:40;text-align:center;">
    <div style="position:absolute;left:50%;top:50%;width:250px;height:250px;margin:-125px 0 0 -125px;
                background:radial-gradient(circle,rgba(247,117,3,.45) 0%,rgba(247,117,3,0) 62%);"></div>
    <div style="position:relative;font-family:var(--display);font-size:86px;line-height:.9;color:var(--lite);
                text-shadow:5px 6px 0 #000, 0 0 34px rgba(247,117,3,.85);">&times;5</div>
    <div style="position:relative;margin-top:2px;font-size:11px;font-weight:900;letter-spacing:3.4px;
                color:var(--orange);text-shadow:2px 2px 0 #000;">ON FIRE</div>
  </div>

  <div class="scan"></div>
  <div class="vig"></div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
