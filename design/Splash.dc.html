<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Underdog&family=Outfit:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root{
      --ink:#0A0806; --panel:#14100C; --panel2:#1E1813; --edge:#3A2E22;
      --orange:#F28D35; --hot:#f77503; --lite:#FFB765;
      --cream:#F5EFE4; --muted:#9C9184;
      --red:#E4322B; --gold:#FFC93C; --cyan:#35D6F2; --magenta:#F2359B;
      --asphalt:#26241F; --lane:#EFE9DC;
      --display:'Underdog','Chalkboard SE','Comic Sans MS',cursive;
      --ui:'Outfit','Avenir Next','Segoe UI',system-ui,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--ui);background:#000;color:var(--cream);-webkit-font-smoothing:antialiased;}
    a{color:var(--orange);} a:hover{color:var(--hot);}
    .screen{position:relative;width:393px;height:852px;overflow:hidden;background:var(--ink);}
    .scan{position:absolute;inset:0;z-index:90;pointer-events:none;
      background:repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1px,rgba(0,0,0,0) 1px 3px);}
    .vig{position:absolute;inset:0;z-index:91;pointer-events:none;
      background:radial-gradient(125% 78% at 50% 44%,rgba(0,0,0,0) 34%,rgba(0,0,0,.62) 100%);}
  </style>
</helmet>

<div class="screen">

  <!-- horizon glow -->
  <div style="position:absolute;left:50%;top:300px;width:760px;height:760px;margin-left:-380px;
              border-radius:50%;background:radial-gradient(circle,rgba(242,141,53,.32) 0%,rgba(247,117,3,.10) 42%,rgba(0,0,0,0) 68%);"></div>

  <!-- receding grid horizon -->
  <div style="position:absolute;left:0;right:0;top:432px;height:420px;overflow:hidden;">
    <div style="position:absolute;inset:0;
      background:
        repeating-linear-gradient(180deg,rgba(242,141,53,.30) 0 2px,rgba(0,0,0,0) 2px 34px),
        linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.85) 78%);"></div>
  </div>
  <div style="position:absolute;left:0;right:0;top:430px;height:3px;background:var(--orange);
              box-shadow:0 0 22px 5px rgba(242,141,53,.65);"></div>

  <!-- speed streaks -->
  <div style="position:absolute;left:26px;top:120px;width:2px;height:150px;background:linear-gradient(180deg,rgba(255,183,101,0),rgba(255,183,101,.55),rgba(255,183,101,0));"></div>
  <div style="position:absolute;left:355px;top:190px;width:2px;height:110px;background:linear-gradient(180deg,rgba(255,183,101,0),rgba(255,183,101,.45),rgba(255,183,101,0));"></div>
  <div style="position:absolute;left:66px;top:60px;width:2px;height:80px;background:linear-gradient(180deg,rgba(255,183,101,0),rgba(255,183,101,.30),rgba(255,183,101,0));"></div>

  <!-- content column; top gap left empty for the real status bar -->
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;z-index:10;">
    <div style="height:150px;flex:none;"></div>

    <!-- logo lockup -->
    <div style="text-align:center;transform:rotate(-3deg);">
      <div style="font-family:var(--display);font-size:66px;line-height:.92;color:var(--orange);
                  text-shadow:5px 6px 0 #000, 0 0 34px rgba(247,117,3,.5);letter-spacing:1px;">BURNING</div>
      <div style="font-family:var(--display);font-size:88px;line-height:.94;color:var(--lite);
                  text-shadow:6px 7px 0 #000, 0 0 40px rgba(247,117,3,.55);letter-spacing:0px;">RUBBER</div>
    </div>

    <!-- tagline with tire for the O -->
    <div style="margin-top:26px;display:flex;align-items:center;gap:3px;font-family:var(--display);
                font-size:27px;color:var(--cream);text-shadow:3px 4px 0 #000;transform:rotate(-3deg);">
      <span>&ldquo;FEAR THE R</span>
      <svg viewBox="0 0 40 40" width="30" height="30" style="display:block;margin:0 1px;">
        <circle cx="20" cy="20" r="18.5" fill="#131110"/>
        <circle cx="20" cy="20" r="15" fill="none" stroke="#2E2A26" stroke-width="5.5" stroke-dasharray="3 4.4"/>
        <circle cx="20" cy="20" r="18.5" fill="none" stroke="#000" stroke-width="1.6"/>
        <circle cx="20" cy="20" r="9.6" fill="#CFC9C0"/>
        <g stroke="#8C877F" stroke-width="2" stroke-linecap="round">
          <line x1="20" y1="11" x2="20" y2="29"/><line x1="11" y1="20" x2="29" y2="20"/>
          <line x1="13.6" y1="13.6" x2="26.4" y2="26.4"/><line x1="26.4" y1="13.6" x2="13.6" y2="26.4"/>
        </g>
        <circle cx="20" cy="20" r="3" fill="#5C5750"/>
      </svg>
      <span>AD&rdquo;</span>
    </div>

    <div style="flex:1 1 auto;"></div>

    <!-- loading -->
    <div style="width:265px;flex:none;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;">
        <span style="font-size:12px;font-weight:800;letter-spacing:2.6px;color:var(--muted);">LOADING</span>
        <span style="font-size:13px;font-weight:800;letter-spacing:1px;color:var(--orange);font-variant-numeric:tabular-nums;">64%</span>
      </div>
      <div style="position:relative;height:17px;background:#100D0A;border:2px solid #000;border-radius:3px;
                  box-shadow:inset 0 2px 6px rgba(0,0,0,.9);overflow:hidden;">
        <div style="position:absolute;left:0;top:0;bottom:0;width:64%;
                    background:linear-gradient(180deg,var(--lite) 0%,var(--orange) 46%,var(--hot) 100%);"></div>
        <div style="position:absolute;inset:0;
                    background:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 9px,rgba(0,0,0,.85) 9px 12px);"></div>
      </div>
    </div>

    <div style="height:26px;flex:none;"></div>
    <div style="font-size:10px;letter-spacing:2.4px;color:#5F5750;font-weight:700;flex:none;">&copy; 2019 ADONIS D MARTIN</div>
    <!-- bottom gap left empty for the real home indicator -->
    <div style="height:52px;flex:none;"></div>
  </div>

  <div class="scan"></div>
  <div class="vig"></div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
